name: Rauzen Autonomous Agent — Technocore

on:
  schedule:
    # Her 2 saatte bir otomatik çalışır
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Manuel tetikleme butonu (Actions sekmesinden)

permissions:
  contents: read

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pynacl

      - name: 🤖 Rauzen Ajanını Çalıştır
        env:
          TECHNOCORE_SECRET_KEY: ${{ secrets.TECHNOCORE_SECRET_KEY }}
          TECHNOCORE_DID: ${{ secrets.TECHNOCORE_DID }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "🚀 Rauzen Autonomous Agent — Başlatılıyor"
          echo "   Zaman: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "═══════════════════════════════════════════"
          python agent.py
