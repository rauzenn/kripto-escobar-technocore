name: Rauzen Autonomous Agent — Technocore

on:
  schedule:
    # Her 12 saatte bir — günde 2 kez bakım (odaları canlı tutar, kaynak korur)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Manuel tetikleme

permissions:
  contents: read

jobs:
  maintenance-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pynacl

      - name: 🤖 Rauzen Bakım Döngüsü
        env:
          TECHNOCORE_SECRET_KEY: ${{ secrets.TECHNOCORE_SECRET_KEY }}
          TECHNOCORE_DID: ${{ secrets.TECHNOCORE_DID }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "🤖 Rauzen Agent v3.0 — Q4 Preparation Mode"
          echo "   Zaman: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "═══════════════════════════════════════════"
          python agent.py
